name: Weekly NFL update

on:
  schedule:
    - cron: "0 11 * 9-12,1 2"   # Tuesdays 11:00 UTC (6-7am Eastern), September to January
  workflow_dispatch:            # adds a "Run workflow" button for manual runs

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::nflreadr
            any::googlesheets4

      - name: Write service account key
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Run update
        run: Rscript update.R
        env:
          GCP_SA_KEY_PATH: ${{ runner.temp }}/sa-key.json
